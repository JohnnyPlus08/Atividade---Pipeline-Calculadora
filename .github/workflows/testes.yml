name: Testes da Calculadora

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O comando zip nativo funciona bem no Ubuntu do build
      - name: Gerar artefato ZIP
        run: zip -r ppipeline-demo.zip .

      - name: Publicar artefato
        uses: actions/upload-artifact@v3
        with:
          name: codigo-buildado
          path: ppipeline-demo.zip

  teste-soma:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Baixar artefato
        uses: actions/download-artifact@v3
        with:
          name: codigo-buildado

      # Extração universal usando Python para não quebrar no Windows do matrix
      - name: Extrair artefato (Pedido do Professor)
        run: python -c "import zipfile; zipfile.ZipFile('ppipeline-demo.zip', 'r').extractall('.')"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - run: pytest -v test_calculadora.py

  teste-subtracao:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Baixar artefato
        uses: actions/download-artifact@v3
        with:
          name: codigo-buildado
      - name: Extrair artefato (Pedido do Professor)
        run: python -c "import zipfile; zipfile.ZipFile('ppipeline-demo.zip', 'r').extractall('.')"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: pytest -v test_calculadora.py::test_subtracao

  teste-multiplicacao:
