name: Testes da Calculadora

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Compacta os arquivos de forma limpa
      - name: Gerar artefato ZIP
        run: zip -r ppipeline-demo.zip *

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: codigo-buildado
          path: ppipeline-demo.zip

  teste-soma:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Baixar artefato
        uses: actions/download-artifact@v4
        with:
          name: codigo-buildado

      # Extração universal usando Python (Pedido do Professor)
      - name: Extrair artefato
        run: python -c "import zipfile; zipfile.ZipFile('ppipeline-demo.zip', 'r').extractall('.')"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - run: pytest -v test_calculadora.py

  teste-subtracao:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Baixar artefato
        uses: actions/download-artifact@v4
        with:
          name: codigo-buildado
      - name: Extrair artefato
        run: python -c "import zipfile; zipfile.ZipFile('ppipeline-demo.zip', 'r').extractall('.')"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: pytest -v test_calculadora.py::test_subtracao

  teste-multiplicacao:
