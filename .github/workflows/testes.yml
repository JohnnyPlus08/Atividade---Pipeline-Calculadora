name: Testes da Calculadora

on:
  push:
    branches:
      - main

jobs:
  teste-soma:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: pytest -v test_calculadora.py

        steps:
        - name: Baixar artefato
          uses: actions/download-artifact@v3
          with:
          name: codigo-buildado

        -name: Extrair artefato
        run: unzip ppipeline-demo.zip

  build:
    - name: Gerar artefato ZIP
      run: zip -r ppipeline-demo.zip .

    - name: Publicar artefato
      uses: actions/upload-artifact@v3
      with:
      name: codigo-buildado
      path: ppipeline-demo.zip

  teste-subtracao:
